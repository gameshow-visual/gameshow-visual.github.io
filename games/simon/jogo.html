<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../lib/css/padrao.css">
    <link rel="stylesheet" href="css/index.css">
    <script type="text/javascript" src="../../lib/javascript/padrao.js"></script>
    <script type="text/javascript" src="js/script.js"></script>
</head>

<style>
    :root {
        --confalt: 100px;
        --conflar: 125px;
    }

    [barra-conf] {
        top: -65px;
    }
</style>

<body>
    <div barra-conf id="bar-conf">
        <div barra-seta onclick="config()"></div>
        <div barra-conteudo>
            <button id="cxiniciar" verde onclick="genius('iniciar');config();">REINICIAR</button>
        </div>
    </div>    
    <div simon>
        <div id="pontos">0</div>
        <div id="cor1" corsimon="1">
            <div fundo style="border-radius: 60px 0px 0px 0px;"></div>
        </div>
        <div id="cor2" corsimon="2">
            <div fundo style="border-radius: 0px 60px 0px 0px;"></div>
        </div>
        <div id="cor3" corsimon="3">
            <div fundo style="border-radius: 0px 0px 0px 60px;"></div>
        </div>
        <div id="cor4" corsimon="4">
            <div fundo style="border-radius: 0px 0px 60px 0px;"></div>
        </div>
    </div>
</body>

<script src="../../lib/javascript/protecao.js"></script>

<script>
    function config() {
        const div = document.getElementById('bar-conf').style;
        if (div.top == '0px') {
            div.top = '-65px';
            div.opacity = "0.5";
        } else {
            div.top = '0px';
            div.opacity = "1";
        }
    }
</script>
