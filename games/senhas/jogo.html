<script>
    function config() {
        const div = document.getElementById('bar-conf').style;
        if (div.top == '0px') {
            div.top = '-65px';
            div.opacity = "0.5";
        } else {
            div.top = '0px';
            div.opacity = "1";
        }
    }
</script>
