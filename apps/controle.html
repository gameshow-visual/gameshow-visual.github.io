    <style>
        body {
            background-color: black;
            /* overflow: hidden; */
            margin: 0;
            height: 100vh;
            font-family: Segoe UI, Arial, Helvetica;
            color: var(--text)
        }

        * {
            box-sizing: border-box;
            /* overflow: hidden; */
            margin: 0px;
            user-select: none;
        }

        :root {
            --bg: #0f1724;
            /* dark blue */
            --card: #0b1220;
            --accent: #60a5fa;
            --muted: #94a3b8;
            --danger: #ef4444;
            --ok: #10b981;
            --radius: 14px;
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
        }

        [telapin] {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #071020;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e6eef8;
            visibility: visible;
            opacity: 1;
            overflow: hidden;
            z-index: 1;
            transition: opacity 1s ease, visibility 1s;
        }

        .wrapper {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
            padding: 22px;
            box-sizing: border-box;
            backdrop-filter: blur(6px) saturate(120%);
        }

        h1 {
            font-size: 20px;
            margin: 0 0 6px
        }

        p.lead {
            color: var(--muted);
            margin: 0 0 18px;
            font-size: 13px
        }

        .pin-dots {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 14px 0 22px;
        }

        .dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2);
            transition: all .18s ease;
        }

        .dot.filled {
            background: var(--accent);
            transform: scale(1.08);
            box-shadow: 0 6px 18px rgba(96, 165, 250, 0.14);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 6px
        }

        .key {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
            transition: transform .08s ease, background .08s ease
        }

        .key:active {
            transform: translateY(2px)
        }

        .key.func {
            font-size: 15px;
            color: var(--muted)
        }

        .status {
            height: 18px;
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: var(--muted)
        }

        .status.error {
            color: var(--danger)
        }

        .status.success {
            color: var(--ok)
        }

        .small {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            margin-top: 12px
        }

        [ifundo] {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        [menu] {
            position: fixed;
            bottom: 5px;
            left: 5px;
            z-index: 4;
        }

        [interacao] {
            position: fixed;
            bottom: 5px;
            right: 5px;
            z-index: 4;
        }

        [cartoes] {
            position: fixed;
            top: 5px;
            right: 5px;
            z-index: 4;
        }

        [menu-controle] {
            width: 60px;
            height: 60px;
            border-radius: 25%;
            background: #333;
            color: white;
            font-size: 24px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        [lista-menu] {
            display: none;
            flex-direction: column;
            margin-bottom: 10px;

            max-height: 310px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 5px;
            grid-template-columns: repeat(auto-fill, 60px);
        }

        [link-menu] {
            width: 60px;
            height: 60px;
            min-width: 60px;
            min-height: 60px;

            border-radius: 25%;
            border: none;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #333;

            flex-shrink: 0;
            margin-top: 2px;
        }

        #setamenu {
            position: absolute;
            width: 30px;
            filter: invert();
        }

        #menuinte {
            position: absolute;
            width: 90%;
        }

        [link-menu]>img {
            object-fit: contain;
            width: 90%;
        }

        [menu-interacao] {
            position: absolute !important;
            width: 90%;
            height: 95%;
            /* top: 2.5%; */
            /* border: 1px solid white; */
            /* box-sizing: border-box; */
            background-color: #e4e4e480;
            z-index: 99 !important;
            border-radius: 20px;
            display: none;
            align-items: center;
            justify-content: center;
        }

        [menu-interacao]>[sair] {
            position: absolute;
            width: 65px;
            height: 65px;
            bottom: 5px;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

        }

        [idinte] {
            display: flex;
            align-items: center;
            justify-content: center !important;
            flex-wrap: wrap;
            width: 100%;
            height: 100%;
        }

        [idinte]>[grupo] {
            border: 1px solid white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        [grupo]>div {
            margin: 1px;
        }

        [logofundo] {
            width: 95%;
            height: 95%;
            object-fit: contain;
            opacity: 0.5;
        }
    </style>
</head>

<script>
    function enableFullscreen() {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
    }
    document.addEventListener("click", enableFullscreen, { once: true });
    document.addEventListener("touchstart", enableFullscreen, { once: true });

    /* CONFIGURAÇÃO: altere aqui o PIN correto e o comportamento ao validar com sucesso */
    const CORRECT_PIN = '325580'; // <-- Mude para o PIN que quiser
    const REDIRECT_URL = 'index.php'; // <-- URL para onde redirecionar quando o PIN estiver correto
    const PIN_LENGTH = 6; // número de dígitos do PIN

    // Não é seguro armazenar PINs sensíveis no frontend em produção. Este exemplo é para uso local/estético.

    // elementos
    const dots = Array.from(document.querySelectorAll('.dot'));
    const keys = document.querySelectorAll('.key');
    const status = document.getElementById('status');
    const pinLengthLabel = document.getElementById('pin-length');
    const attemptsLabel = document.getElementById('attempts');

    pinLengthLabel.textContent = PIN_LENGTH;

    let entered = '';
    let attempts = 0;
    attemptsLabel.textContent = attempts;

    function refreshDots() {
        dots.forEach((d, i) => {
            d.classList.toggle('filled', i < entered.length);
        });
    }

    function setStatus(text, cls) {
        status.textContent = text;
        status.className = 'status' + (cls ? ' ' + cls : '');
    }

    function pressKey(key) {
        if (key === 'back') {
            entered = entered.slice(0, -1);
            setStatus('', '');
            refreshDots();
            return;
        }
        if (key === 'clear') {
            entered = '';
            setStatus('', '');
            refreshDots();
            return;
        }
        if (entered.length >= PIN_LENGTH) return; // evita ultrapassar
        if (/^[0-9]$/.test(key)) {
            entered += key;
            refreshDots();
        }
        if (entered.length === PIN_LENGTH) {
            checkPin();
        }
    }

    function checkPin() {
        if (entered === CORRECT_PIN) {
            setStatus('PIN correto — redirecionando...', 'success');
            keys.forEach(k => k.style.pointerEvents = 'none');
            // desativa teclado
            setTimeout(() => {
                document.getElementById("telapin").style.visibility = 'none';
                document.getElementById("telapin").style.opacity = 0;
            }, 600);
            setTimeout(() => {
                document.getElementById("telapin").remove();
            }, 1200);
        } else {
            attempts++;
            attemptsLabel.textContent = attempts;
            setStatus('PIN incorreto — tente novamente', 'error');
            // vibração em dispositivos suportados
            if (navigator.vibrate) navigator.vibrate(120);
            // limpar com efeito
            setTimeout(() => { entered = ''; refreshDots(); setStatus('', ''); }, 700);
        }
    }

    // clique no teclado
    keys.forEach(k => {
        k.addEventListener('click', () => {
            pressKey(k.dataset.key);
        });
    });

    // suporte a teclado físico: números, Backspace, Enter, Escape
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace') { pressKey('back'); e.preventDefault(); return; }
        if (e.key === 'Escape') { pressKey('clear'); return; }
        if (e.key === 'Enter') { if (entered.length === PIN_LENGTH) checkPin(); return; }
        if (/^[0-9]$/.test(e.key)) { pressKey(e.key); }
    });

    // acessibilidade: foco por teclado
    keys.forEach(k => k.setAttribute('tabindex', '0'));
    keys.forEach(k => k.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { k.click(); e.preventDefault(); }
    }));

    // opcional: proteger contra muitas tentativas (simples)
    function lockoutIfNeeded() {
        // exemplo simples: bloquear por 5s se >9 tentativas
        if (attempts >= 10) {
            setStatus('Muitas tentativas — bloqueado por 10 segundos', 'error');
            keys.forEach(k => k.style.pointerEvents = 'none');
            setTimeout(() => { keys.forEach(k => k.style.pointerEvents = 'auto'); setStatus('', ''); attempts = 0; attemptsLabel.textContent = attempts }, 10000);
        }
    }

    // observa alterações de attempts
    const attemptsObserver = new MutationObserver(lockoutIfNeeded);
    attemptsObserver.observe(attemptsLabel, { childList: true, characterData: true, subtree: true });

    // inicial
    refreshDots();

    // função utilitária para ajustar PIN e URL em tempo de execução (útil para testes)
    window.__pinConfig = {
        setPin: (p) => { if (/^[0-9]+$/.test(p)) { window.CORRECT_PIN = p; console.log('PIN alterado para', p); } else console.warn('PIN inválido'); },
        setRedirect: (u) => { window.REDIRECT_URL = u; console.log('REDIRECT alterado para', u); }
    };
