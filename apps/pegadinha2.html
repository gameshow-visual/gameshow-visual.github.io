<style>
    body {
        cursor: none;
        /* Esconde o cursor original */
        overflow: hidden;
    }

    #cursorGigante {
        position: fixed;
        width: 32px;
        height: 32px;
        pointer-events: none;
        z-index: 999999;
        transform-origin: center;
        transition: transform 3s ease-in-out;
    }

    #teste {
        position: fixed;
        width: 128px;
        height: 128px;
        pointer-events: none;
        z-index: 999999;
        transform-origin: center;
        transition: transform 0.8s ease-in-out;
    }
</style>

<script>
    let inicio = 0;
    const cursor = document.getElementById("cursorGigante");

    document.addEventListener("mousemove", (e) => {
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";
    });

    function mudarRotacao() {
        let aleatorio = Math.floor(Math.random() * 21) - 10;
        inicio = inicio + aleatorio;
        document.getElementById("cursorGigante").style.transform = `rotate(${inicio}deg)`;
    }

    setInterval(mudarRotacao, 3000);

</script>
