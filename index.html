<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- <meta name="apple-mobile-web-app-capable" content="yes"> -->
    <!-- <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="lib/json/manifest.json">
    <title>GameShow & Visual</title>
    <!-- <link rel="stylesheet" href="lib/css/padrao.css"> -->
    <link rel="stylesheet" href="lib/css/index.css">
    <script type="text/javascript" src="lib/javascript/padrao.js"></script>
    <script type="text/javascript" src="lib/javascript/index.js"></script>
    <link rel="icon" href="lib/img/logo/favicon.ico" type="image/x-icon">
</head>

<style>
    /* Celulares retrato */
    @media (max-width: 767px) and (orientation: portrait) {
        [tamanho]::before {
            content: "CELULAR EM PÉ";
        }
    }

    /* Celulares paisagem */
    @media (max-width: 767px) and (orientation: landscape) {
        [tamanho]::before {
            content: "CELULAR DEITADO";
        }
    }

    /* Tablets retrato */
    @media (min-width: 768px) and (max-width: 1023px) and (orientation: portrait) {
        [tamanho]::before {
            content: "TABLET EM PÉ";
        }

    }

    /* Tablets paisagem */
    @media (min-width: 768px) and (max-width: 1023px) and (orientation: landscape) {
        [tamanho]::before {
            content: "TABLET DEITADO";
        }
    }

    /* Desktop */
    @media (min-width: 1024px) {
        [tamanho]::before {
            content: "DESKTOP";
        }
    }

    [tamanho] {
        position: absolute;
        top: 0px;
        color: white;
    }

    [menu] {
        position: fixed;
        bottom: 5px;
        left: 5px;
        z-index: 4;
    }

    [menu-controle] {
        width: 60px;
        height: 60px;
        border-radius: 25%;
        background: #333;
        color: white;
        font-size: 24px;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    [lista-menu] {
        display: none;
        flex-direction: column;
        margin-bottom: 10px;

        max-height: 310px;
        overflow-y: auto;
        overflow-x: hidden;
        padding-right: 5px;
        grid-template-columns: repeat(auto-fill, 60px);
    }

    [link-menu] {
        width: 60px;
        height: 60px;
        min-width: 60px;
        min-height: 60px;

        border-radius: 25%;
        border: none;
        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #333;

        flex-shrink: 0;
        margin-top: 2px;
    }

    #setamenu {
        position: absolute;
        width: 30px;
        filter: invert();
    }

    [link-menu]>img {
        object-fit: contain;
        width: 90%;
    }
</style>
</head>


<body fundo="logo">
    <iframe ifundo id="index" src="games/simon/jogo.html" frameBorder="0" scrolling="no"></iframe>
    <!-- <div tamanho></div> -->
    <div menu>
        <div menu-controle onclick="toggleMenu()">
            <img id="setamenu" src="../lib/img/util/cima.png">
        </div>
        <div lista-menu id="menuItems">
            <div laranja link-menu onclick="abrirmenu('games/simon/jogo.html')"><img src="games/simon/lib/logo.png"></div>
        </div>
    </div>
</body>

<script src="lib/javascript/protecao.js"></script>

<script>
    function toggleMenu() {
        document.documentElement.requestFullscreen();
        const menu = document.getElementById("menuItems");
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
        if (menu.style.display === "flex") {
            document.getElementById("setamenu").src = "../lib/img/util/abaixo.png";
        } else {
            document.getElementById("setamenu").src = "../lib/img/util/cima.png";

        }
    }

    function abrirmenu(arquivo) {
        toggleMenu();
        document.getElementById("index").src = arquivo;
    }

</script>
