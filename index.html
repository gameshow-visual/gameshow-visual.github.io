<script>
    function detectarDispositivo() {
        const largura = window.innerWidth;
        const altura = window.innerHeight;
        const retrato = altura > largura;
        let tipo;
        if (largura < 768) {
            tipo = retrato
                ? "celular-retrato"
                : "celular-paisagem";
        }
        else if (largura >= 768 && largura <= 1024 && retrato) {
            tipo = "tablet-retrato";
        }
        else {
            tipo = "desktop";
        }
        document.body.dataset.dispositivo = tipo;
        console.log({
            largura,
            altura,
            orientacao: retrato ? "retrato" : "paisagem",
            dispositivo: tipo
        });
    }
    detectarDispositivo();
    window.addEventListener("resize", detectarDispositivo);
</script>
