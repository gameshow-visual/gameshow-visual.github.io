<script>
    function abrir(nome) {
        document.getElementById("baseframe").src = nome;
    }

    async function entbase() {
        const base = await fetch("central/entrada/base.php");
        const cmdbase = await base.text();

        if (cmdbase.trim()) {
            console.log("[BASE] RECEBIDO:", cmdbase);
            executar(cmdbase);
        }
    }

    function executar(cmd) {
        if (cmd.startsWith("tempo=")) {
            const vtempo = cmd.replace("tempo=", "");
            tempo(vtempo);
            return;
        }

        if (cmd.startsWith("click=")) {
            const idclick = cmd.replace("click=", "");
            document.getElementById(idclick).click();
            return;
        }

        if (cmd.startsWith("modo=")) {
            const vmodo = cmd.replace("modo=", "");
            document.getElementById("tamanho").setAttribute("modo", vmodo);
            return;
        }

        if (cmd.startsWith("resposta=")) {
            const vresp = cmd.replace("resposta=", "");
            resposta(vresp);
            return;
        }

        if (cmd.startsWith("explosao")) {
            explosao(5);
            return;
        }

        // if (cmd.startsWith("tutorial")) {
        //     tutorial('tutorial.mp4');
        //     return;
        // }

        // Função 

        // Função com valor do controle
        if (cmd.startsWith("valor=")) {
            const valor = cmd.replace("valor=", "");
            // função com o valor do controle
            return;
        }

    }
    // setInterval(entbase, 300);
    // setInterval(entmodo, 300);

    function resposta(opcao) {
        var img = document.createElement("img");
        img.id = 'respimg';
        if (opcao == 'certa') { img.src = 'lib/img/util/certa.png'; }
        else if (opcao == 'errada') { img.src = 'lib/img/util/errada.png'; }
        document.querySelector('[resposta]').appendChild(img);

        setTimeout(() => {
            if (opcao == 'certa') { corfundo('verde'); }
            else if (opcao == 'errada') { corfundo('vermelho'); }
        }, 0);

        setTimeout(() => {
            document.getElementById('respimg').style.transform = "scale(1.3)";
        }, 300);

        setTimeout(() => {
            if (opcao == 'certa') {
                explosao(1);
            }
            document.getElementById('respimg').style.transform = "scale(1)";
        }, 1000);

        setTimeout(() => {
            if (opcao == 'errada') {
                document.getElementById('respimg').style.transform = "scale(0)";
            }
        }, 1500);

        setTimeout(() => {
            if (opcao == 'certa') {
                document.getElementById('respimg').style.transform = "scale(0)";
            }
        }, 1750);

        setTimeout(() => {
            if (opcao == 'errada') { corfundo(); }
        }, 2000);

        setTimeout(() => {
            if (opcao == 'certa') { corfundo(); }
            else if (opcao == 'errada') {
                document.getElementById('respimg').remove();
            }
        }, 2250);

        setTimeout(() => {
            if (opcao == 'certa') {
                document.getElementById('respimg').remove();
            }
        }, 2500);
    }    
</script>
