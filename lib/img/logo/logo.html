<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="../../css/padrao.css">
</head>

<style>
    .glitch-trans {
        font-size: 70px;
        animation: shift 4s ease-in-out infinite alternate;
    }

    img {
        width: 95%;
        height: 95%;
        object-fit: contain;
    }

    [logo] {
        position: relative;
        aspect-ratio: 1/1;
        width: 400px;
    }

    [logo]>img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    [ligrosa] {
        animation: neonrosa 5s ease-in-out infinite;
    }

    [ligamar] {
        animation: neonamar 5s ease-in-out infinite;
    }

    @keyframes neonrosa {
        50% {
            filter:
                drop-shadow(0 0 12px #ff59c7);
        }

        0%,
        100% {
            filter:
                drop-shadow(0 0 0px #ff59c7);
        }
    }


    @keyframes neonamar {
        50% {
            filter:
                drop-shadow(0 0 12px #ffcc00);
        }

        0%,
        100% {
            filter:
                drop-shadow(0 0 0px #ffcc00);
        }
    }

    [nome] {
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;

        text-align: center;
        white-space: normal;
        word-wrap: break-word;
        bottom: 0px;
    }

    .glitch-trans {
        font-family: 'HennyPenny';
        position: relative;
        font-weight: 700;
        line-height: 1.2;
        color: #fff;
        letter-spacing: 5px;
        transform: skewX(15deg) skewY(-15deg);
        z-index: 1;
        text-shadow: 2px 2px 5px black;
    }

    @keyframes shift{

        0%,
        40%,
        44%,
        58%,
        61%,
        65%,
        69%,
        73%,
        100% {
            transform: skewX(0deg);
        }

        41% {
            transform: skewX(25deg);
        }

        42% {
            transform: skewX(-25deg);
        }

        59% {
            transform: skewX(15deg) skewY(15deg);
        }

        60% {
            transform: skewX(-15deg) skewY(-15deg);
        }

        63% {
            transform: skewX(15deg) skewY(-15deg);
        }

        70% {
            transform: skewX(-15deg) skewY(-15deg);
        }

        71% {
            transform: skewX(15deg) skewY(-15deg);
        }
    }

    [posicao] {
        width: 400px;
        height: fit-content;
    }
</style>

<body>
    <div posicao>
        <div logo>
            <img src="svg-azul.svg">
            <img ligamar src="svg-amarelo.svg">
            <img ligrosa src="svg-rosa.svg">
            <img src="svg-branco.svg">
        </div>
        <div nome>
            <div class="glitch-trans">GameShow & Visual</div>
        </div>
    </div>
</body>

<script src="../../javascript/protecao.js"></script>
<script src="../../javascript/index.js"></script>

</html>
