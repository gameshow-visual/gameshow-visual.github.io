<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title></title>
<style>

* {
  margin: 0;
  /* background-color: #00ff00; */
  background-color: #001e49;
  /* background-color: #6b2020; */
  /* background-color: #1a2912; */
  user-select: none;
}

@keyframes scrollBackground {
  from {
    background-position: 0 0;
  }
  to {
    background-position: 512px 448px;
  }
}

.logo-wall { 
    position: relative;
    width: 100%; 
    height: 100vh; 
    background: url('../fundo/logo-para-video-2.png') repeat center top;
    opacity: 0.1;
    /* background-size: 150%; */
    overflow: hidden;
    animation: scrollBackground 20s linear infinite;
}

.logo-wall img {
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: -51px;
    margin-left: -51px;
}

</style>


</head>
<body>
<div class="logo-wall" id="wall"></div>
<script src="../js/protecao.js"></script>
</body>
</html>
