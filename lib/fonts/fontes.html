<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>GameShow & Visual</title>
    <!-- <link rel="stylesheet" href="../lib/css/padrao.css"> -->
    <link rel="stylesheet" href="fontes.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="icon" href="../img/logo/favicon.ico" type="image/x-icon">
    <!-- <script type="text/javascript" src="../lib/javascript/padrao.js"></script> -->

    <style>
        * {
            overflow-x: hidden;
        }

        img {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 25px;
        }

        [teste] {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 3vh;
        }

        [fonte] {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: right;
            top: 5px;
            width: auto;
            max-width: 100%;
            right: 5px;
            height: 27px;
        }

        [separar] {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: white;
            margin-bottom: 10px;
            width: 95vw;
            height: 200px;
            cursor: pointer;
            border-radius: 10px;
            box-sizing: border-box;
        }
    </style>

</head>

<body fundo="logo">
    <div id="fontes">
    </div>
</body>

<script>
    const fontes = ['Bebas', 'Cartas', 'Chau', 'Digital', 'Display', 'Encode', 'HennyPenny', 'Roboto', 'Roboto-2', 'Roboto-3', 'Roboto-4', 'Roboto-5'];

    const listafontes = document.getElementById("fontes");

    // for (let f = 1; f <= 0; f++) {
    for (let f = 1; f <= fontes.length; f++) {
        var div = document.createElement("div");
        div.setAttribute("separar", "");
        div.onclick = function () { copiar(f) };
        div.innerHTML = '<img src="../../lib/img/util/copiar.png"><div fonte id="f">font-family: ' + fontes[f - 1] + '</div><div teste style="font-family: ' + fontes[f - 1] + ';"><center>abcdefghijklmnopqrstuvwxyz<br>ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>0123456789</center></div>';
        // div.innerHTML = '<div teste style="font-family: ' + fontes[f - 1].nome + ', ' + fontes[f - 1].tipo + ';">abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789</div>';        
        listafontes.appendChild(div);
    }

    const copiar = function (n) {
        var copiarTexto = 'font-family: ' + fontes[n - 1] + ';'
        navigator.clipboard.writeText(copiarTexto);
        alert("COPIADO: " + copiarTexto);
    }

    console.log(fontes.length);
</script>
