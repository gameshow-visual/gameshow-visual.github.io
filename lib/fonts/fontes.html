<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

    img {
        position: absolute;
        top: 5px;
        left: 5px;
        width: 25px;
    }

    [teste] {
        left: 0;
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        bottom: 0px;
        width: 100%;
        height: 120px;
        /* border: 1px solid red; */
        font-size: 3vh;
    }

    [fonte] {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: right;
        top: 5px;
        width: auto;
        max-width: 100%;
        right: 5px;
        height: 27px;
        /* border: 1px solid red; */
    }

    [separar] {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: white;
        margin-bottom: 10px;
        width: 100%;
        height: 155px;
        cursor: pointer;
        border-radius: 10px;
        ;
    }

    #fontes {
        position: relative;
        /* melhor que absolute */
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        box-sizing: border-box;
        /* border: 1px solid blue; */
    }
</style>
