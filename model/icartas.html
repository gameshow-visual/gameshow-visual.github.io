<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="../lib/css/padrao.css">
    <script type="text/javascript" src="../lib/javascript/padrao.js"></script>

    <style>
        :root {
            --calti: 80px;
            --clari: 80px;
        }

        /*      CARTAS - VERSÃO: 1.1     |       REVISÃO:    06/01/25  */

        [frentei],
        [atrasi] {
            /* position: absolute; */
            width: 100% !important;
            height: 100% !important;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        [frentei],
        [atrasi] {
            position: absolute;
            top: 0;
            left: 0;
        }

        [frentei],
        [atrasi] {
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }


        [atrasi] {
            transform: rotateY(180deg);
        }

        [pcartai],
        [cartai] {
            transform-style: preserve-3d;
            transition: opacity .6s, transform .6s, visibility .6s;
        }

        [cartai] {
            transform-style: preserve-3d;
            position: relative;
        }

        [pcartai],
        [cartai] {
            width: 80px;
            height: 80px;
            perspective: 600px;
            cursor: pointer;
            z-index: 1;
            position: relative !important;
            float: left;
        }

        [frentei] {
            color: white;
            font-size: 40pt;
            font-family: 'Chau-Philomene-One', sans-serif;
            position: relative;
        }

        [frentei]>* {
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.5)) !important;

        }

        /* NOVO */

        button {
            position: relative;
        }


        [baseicartas] {
            border: 1px solid blue;
            position: absolute;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-content: start;
            height: 240px;
            width: 400px;
        }

        /* 30.css */

        /* [capeq] {

        }

        [cagra] {

        } */

        [frentei="2"],

<body fundo="logo">
    <div modo="site">

            </div> -->
        </div>


        <div style="position: absolute; top:0px;">
            <button verde onclick="icarta('virar','todas', 15)">VIRAR TODAS ICARTAS</button>
        </div>
    </div>
</body>

<script>
    // ICARTAS (VIRAR UM / TODAS - GERAR)
    function icarta(opcao, valor, num) {
        if (opcao == 'virar') {
            if (valor == 'todas') {
                for (let i = 1; i <= num; i++) {
                    setTimeout(() => {
                        var vcarta = document.getElementById("ic" + i).style
                        if (vcarta.transform == "rotateY(180deg)") {
                            vcarta.transform = "rotateY(-30deg)"
                            setTimeout(function () {
                                vcarta.transform = "rotateY(0deg)"
                            }, 500)
                        } else {
                            vcarta.transform = "rotateY(210deg)"
                            setTimeout(function () {
                                vcarta.transform = "rotateY(180deg)"
                            }, 500)
                        }
                    }, 20 * i);
                }
            } else {
                var vcarta = document.getElementById("ic" + valor).style
                if (vcarta.transform == "rotateY(180deg)") {
                    vcarta.cursor = "no-drop";
                } else {
                    vcarta.transform = "rotateY(210deg)"
                    setTimeout(function () {
                        vcarta.transform = "rotateY(180deg)"
                        vcarta.cursor = "no-drop";
                    }, 500)
                }
            }
        }

        else if (opcao == 'gerar') {
            if (valor == 'pequena') {
                for (let i = 1; i <= 15; i++) {
                    var div = document.createElement("div");
                    div.setAttribute('pcartai', '')
                    div.innerHTML = `<div cartai id="ic${i}" onclick="icarta('virar', ${i});"><div frentei="${i}"><div>${i}</div></div><div atrasi="${i}" id="resp${i}"></div>`;
                    // div.innerHTML = `<div cartai id="ic${i}" onclick="icarta('virar', ${i});"><div frentei="${i}"><div>${i}</div></div><div atrasi="${i}" id="resp${i}"></div>`;                    
                    document.querySelector('[baseicartas]').appendChild(div);
                }
            }
            else if (valor == 'grande') {
                for (let i = 1; i <= 30; i++) {
                    var div = document.createElement("div");
                    div.setAttribute('pcartai', '')
                    div.innerHTML = `<div cartai id="ic${i}" onclick="icarta('virar', ${i});"><div frentei="${i}"><div>${i}</div></div><div atrasi="${i}" id="resp${i}"></div>`;
                    document.querySelector('[baseicartas]').appendChild(div);
                }
            }
        }
    }

    icarta('gerar', 'pequena');

    for (let i = 1; i <= 15; i++) {
        document.getElementById("resp" + i).style.backgroundImage = "url('teste.png')";
        // document.getElementById("resp" + i).style.backgroundImage = "url('lib/img/" + pais[nrodada] + ".jpg')";
    }
</script>
