<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="../lib/css/padrao.css">
    <script type="text/javascript" src="../lib/javascript/padrao.js"></script>

    <style>
        /*      CARTAS - VERSÃO: 1.1     |       REVISÃO:    06/01/25  */

        [carta],
        [cartai],
        [frente],
        [frente]>[fundo],
        [atras],
        [frentei],
        [atrasi],
        [info] {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        [pcarta] {
            position: relative;
            float: left;
            margin: 1px;
            width: var(--clar);
            height: var(--calt);
            perspective: 600px;
            z-index: 1;
            cursor: pointer;
        }

        [frente],
        [atras] {
            border: var(--cbor) solid white;
            border-radius: var(--crad);
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        [frentei],
        [atrasi] {
            border: var(--cbori) solid white;
            border-radius: var(--cradi);
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }


        [atras],
        [atrasi] {
            transform: rotateY(180deg);
        }

        [pcartai],
        [cartai],
        [pcarta],
        [carta] {
            transform-style: preserve-3d;
            transition: opacity .6s, transform .6s, visibility .6s;
        }

        [frente]>[fundo] {
            opacity: 0.1;
            background-image: linear-gradient(135deg, #959595 25%, transparent 25%), linear-gradient(225deg, #959595 25%, transparent 25%), linear-gradient(45deg, #959595 25%, transparent 25%), linear-gradient(315deg, #959595 25%, #e5e5f7 25%);
            background-position: 15px 0, 15px 0, 0 0, 0 0;
            background-size: 30px 30px;
            background-repeat: repeat;
        }

        [info] {
            font-family: 'Chau-Philomene-One', sans-serif;
            font-size: calc(var(--clar)/1.1);
            filter: drop-shadow(5px 5px 5px rgba(0, 0, 0, 0.5));
        }

        [frente]>[info] {
            color: white;
        }

        [atras]>[info] {
            color: black;
        }

        [atras]>* {
            filter: drop-shadow(5px 5px 5px rgba(0, 0, 0, 0.5));
        }

        [pcartai] {
            width: var(--clari);
            height: var(--calti);
            --cbor: 4px;
            --crad: 10px;
            perspective: 600px;
            cursor: pointer;
        }

        [frentei] {
            font-family: 'Chau-Philomene-One', sans-serif;
            font-size: calc(var(--clar)/1.1);
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.5));
        }

        [frente]>[info] {
            transition: all 0.25s;
        }

        [frente]>img,
        [atras]>img {
            width: 95%;
            z-index: 0;
        }

        /* 30 */


        [atrasi] {
            width: 100%;
            height: 100%;
        }

        [frentei]>div {
            color: white;
            font-size: 45pt;
            filter: drop-shadow(5px 5px 4px rgba(0, 0, 0, 0.5));
        }

        [capeq] {
            background: url('../img/logo/15.png');
        }

        [cagra] {
            background: url('../img/logo/30.png');
        }

        [frentei="1"],
        [frentei="3"],
        [frentei="5"],
        [frentei="7"],
        [frentei="9"],
        [frentei="11"],
        [frentei="13"],
        [frentei="15"],
        [frentei="17"],
        [frentei="19"],
        [frentei="21"],
        [frentei="23"],
        [frentei="25"],
        [frentei="27"],
        [frentei="29"] {
            background-color: rgb(22, 103, 255);
        }

        [frentei="2"],
        [frentei="4"],
        [frentei="6"],
        [frentei="8"],
        [frentei="10"],
        [frentei="12"],
        [frentei="14"],
        [frentei="16"],
        [frentei="18"],
        [frentei="20"],
        [frentei="22"],
        [frentei="24"],
        [frentei="26"],
        [frentei="28"],
        [frentei="30"] {
            background-color: rgb(255, 48, 48);
        }

        [atrasi="1"],
        [frentei="1"] {
            background-position: 0px 0px;
        }

        [atrasi="2"],
        [frentei="2"] {
            background-position: 320px 0px;
        }

        [atrasi="3"],
        [frentei="3"] {
            background-position: 240px 0px;
        }

        [atrasi="4"],
        [frentei="4"] {
            background-position: 160px 0px;

        [atrasi="5"],

        }

        [atrasi="6"],
        [frentei="6"] {
            background-position: 0px -80px;
        }

        [atrasi="7"],
        [frentei="7"] {
            background-position: 320px -80px;
        }

        [atrasi="8"],

            background-position: 240px -80px;
        }

        [atrasi="9"],
        [frentei="9"] {
            background-position: 160px -80px;
        }

        [atrasi="10"],
        [frentei="10"] {
            background-position: 80px -80px;
        }

        [atrasi="11"],
        [frentei="11"] {
            background-position: 0px -160px;
        }

        [atrasi="12"],
        [frentei="12"] {
            background-position: 320px -160px;
        }

        [atrasi="13"],
        [frentei="13"] {
            background-position: 240px -160px;
        }

        [atrasi="14"],
        [frentei="14"] {
            background-position: 160px -160px;
        }

        [atrasi="15"],
        [frentei="15"] {
            background-position: 80px -160px;

        [atrasi="16"],

        [atrasi="17"],

        [atrasi="18"],

        }

        [atrasi="19"],
        [frentei="19"] {
            background-position: 160px -240px;
        }

        [atrasi="20"],
        [frentei="20"] {
            background-position: 80px -240px;
        }

        [atrasi="21"],
        [frentei="21"] {
            background-position: 0px -320px;
        }

        [atrasi="22"],
        [frentei="22"] {
            background-position: 320px -320px;
        }

        [atrasi="23"],
        [frentei="23"] {
            background-position: 240px -320px;
        }

        [atrasi="24"],
        [frentei="24"] {
            background-position: 160px -320px;
        }

        [atrasi="25"],
        [frentei="25"] {

        }

        [atrasi="26"],
        [frentei="26"] {
            background-position: 0px -400px;
        }

        [atrasi="27"],
        [frentei="27"] {

        }

        }

        }

        [atrasi="30"],
        [frentei="30"] {

        }

        [pcartai] {
            z-index: 1;
            position: relative !important;
            float: left;
        }

        /* NOVO */


        body {
            color: white;
        }

        button {
            position: relative;
        }

        :root {
            --calt: 100px;
            --clar: 100px;
            --cbor: 5px;
            --crad: 10px;

            --calti: 66px;
            --clari: 66px;
            --cradi: 0px;
            --cbori: 0px;
        }

        [basecartas] {
            border: 1px solid blue;
            height: 261px;
            width: 500px;
            top: 80px;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            flex-wrap: wrap;
            align-content: start;
        }

        [baseicartas] {
            position: absolute;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-content: start;
            border: 1px solid blue;
            height: 261px;
            width: 333px;
            bottom: 50px;
        }
    </style>
</head>

<body fundo="logo">

    <div basecartas></div>
    <div baseicartas></div>

    <button azul onclick="carta('virar','todas', 6)">VIRAR TODAS CARTAS</button>
    <button verde onclick="icarta('virar','todas', 15)">VIRAR TODAS ICARTAS</button>
</body>

<script>

    // CARTAS - (VIRAR UM / TODAS - GERAR)
    function carta(opcao, valor, num) {

        if (opcao == 'virar') {
            if (valor == 'todas') {
                for (let i = 1; i <= num; i++) {
                    setTimeout(() => {
                        var vcarta = document.getElementById("c" + i).style
                        if (vcarta.transform == "rotateY(180deg)") {
                            vcarta.transform = "rotateY(-30deg)"
                            setTimeout(function () {
                                vcarta.transform = "rotateY(0deg)"
                            }, 500)
                        } else {
                            vcarta.transform = "rotateY(210deg)"
                            setTimeout(function () {
                                vcarta.transform = "rotateY(180deg)"
                            }, 500)
                        }
                    }, 50 * i);
                }
            } else {
                var vcarta = document.getElementById("c" + valor).style
                if (vcarta.transform == "rotateY(180deg)") {
                    vcarta.transform = "rotateY(-30deg)"
                    setTimeout(function () {
                        vcarta.transform = "rotateY(0deg)"
                    }, 500)
                } else {
                    vcarta.transform = "rotateY(210deg)"
                    setTimeout(function () {
                        vcarta.transform = "rotateY(180deg)"
                    }, 500)
                }
            }
        }
        else if (opcao == 'gerar') {
            for (let i = 1; i <= num; i++) {
                var div = document.createElement("div");
                div.setAttribute('pcarta', '')
                div.id = 'cn' + i;
                div.setAttribute('posicao', i)
                div.innerHTML = `<div carta id="c${i}" onclick="carta('virar', ${i});"><div frente cor="${valor}"><div fundo></div><div info id="cfi${i}">${i}</div></div><div atras id="ca${i}" cor="carta"><div info id="cai${i}">${i}</div></div></div>`
                document.querySelector('[basecartas]').appendChild(div);
            }
        }
    }

    // ICARTAS (VIRAR UM / TODAS - GERAR)
    function icarta(opcao, valor, num) {
        if (opcao == 'virar') {
            if (valor == 'todas') {
                for (let i = 1; i <= num; i++) {
                    setTimeout(() => {
                        var vcarta = document.getElementById("ic" + i).style
                        if (vcarta.transform == "rotateY(180deg)") {
                            vcarta.transform = "rotateY(-30deg)"
                            setTimeout(function () {
                                vcarta.transform = "rotateY(0deg)"
                            }, 500)
                        } else {
                            vcarta.transform = "rotateY(210deg)"
                            setTimeout(function () {
                                vcarta.transform = "rotateY(180deg)"
                            }, 500)
                        }
                    }, 20 * i);
                }
            } else {
                var vcarta = document.getElementById("ic" + valor).style
                if (vcarta.transform == "rotateY(180deg)") {
                    vcarta.cursor = "no-drop";
                } else {
                    vcarta.transform = "rotateY(210deg)"
                    setTimeout(function () {
                        vcarta.transform = "rotateY(180deg)"
                        vcarta.cursor = "no-drop";
                    }, 500)
                }
            }
        }

        else if (opcao == 'gerar') {
            if (valor == 'pequena') {
                for (let i = 1; i <= 15; i++) {
                    var div = document.createElement("div");
                    div.setAttribute('pcartai', '')
                    div.innerHTML = `<div cartai id="ic${i}" onclick="icarta('virar', ${i});"><div capeq frentei="${i}"><div>${i}</div></div><div atrasi="${i}" id="resp${i}"></div>`;
                    document.querySelector('[baseicartas]').appendChild(div);
                }
            }
            else if (valor == 'grande') {
                for (let i = 1; i <= 30; i++) {
                    var div = document.createElement("div");
                    div.setAttribute('pcartai', '')
                    div.innerHTML = `<div cartai id="ic${i}" onclick="icarta('virar', ${i});"><div cagra frentei="${i}"><div>${i}</div></div><div atrasi="${i}" id="resp${i}"></div>`;
                    document.querySelector('[baseicartas]').appendChild(div);
                }
            }
        }
    }

    carta('gerar', 'preto', 6);

    const letras = ['A', 'B', 'C', 'D', 'E', 'F'];
    for (let i = 1; i <= 6; i++) {
        document.getElementById('cai' + i).innerHTML = letras[i - 1];
    }

    icarta('gerar', 'pequena');
</script>
