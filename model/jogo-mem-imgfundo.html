<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="../lib/css/padrao.css">
    <script type="text/javascript" src="../lib/javascript/padrao.js"></script>

    <style>
        body {
            color: white;
        }

        [quadrado] {
            color: white;
            box-sizing: border-box;
            width: 90px;
            height: 90px;
            border: 1px solid white;
            margin: 5px;

            /* background-image: url('teste2.png'); */
            background-size: 402px 502px;
            /* tamanho TOTAL da imagem */
            background-repeat: no-repeat;
        }

        [base] {
            width: 402px;
            height: 502px;
            border: 1px solid yellow;
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-content: start;
        }

        [foto] {
            position: absolute;
            background: blue;
            width: 402px;
            height: 502px;
            z-index: -1;
        }

        /*      CARTAS - VERSÃO: 1.1     |       REVISÃO:    06/01/25  */

        [carta],
        [frente],
        [frente]>[fundo],
        [atras],
        [info] {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        [pcarta] {
            position: relative;
            float: left;
            margin: 0px;
            width: var(--clar);
            height: var(--calt);
            perspective: 600px;
            z-index: 1;
            cursor: pointer;
            top: -1px;
            left: -1px;
        }

        [frente],
        [atras] {
            border: var(--cbor) solid white;
            border-radius: var(--crad);
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        [atras] {
            transform: rotateY(180deg);
        }

        [pcarta],
        [carta] {
            transform-style: preserve-3d;
            transition: opacity .6s, transform .6s, visibility .6s;
        }

        [frente]>[fundo] {
            opacity: 0.1;
            background-image: linear-gradient(135deg, #959595 25%, transparent 25%), linear-gradient(225deg, #959595 25%, transparent 25%), linear-gradient(45deg, #959595 25%, transparent 25%), linear-gradient(315deg, #959595 25%, #e5e5f7 25%);
            background-position: 15px 0, 15px 0, 0 0, 0 0;
            background-size: 30px 30px;
            background-repeat: repeat;
        }

        [info] {
            font-family: 'Chau-Philomene-One', sans-serif;
            font-size: calc(var(--clar)/1.1);
            filter: drop-shadow(5px 5px 5px rgba(0, 0, 0, 0.5));
        }

        [frente]>[info] {
            color: white;
        }

        [atras]>[info] {
            color: black;
        }

        [atras]>* {
            filter: drop-shadow(5px 5px 5px rgba(0, 0, 0, 0.5));
        }

        [frente]>[info] {
            transition: all 0.25s;
        }

        [frente]>img,
        [atras]>img {
            width: 95%;
            z-index: 0;
        }

        /* NOVO */

        body {
            color: white;
        }

        button {
            position: relative;
        }

        :root {
            --calt: 90px;
            --clar: 90px;
            --cbor: 3px;
            --crad: 0px;
        }

        /*  */

        /* Y */
        #quad1,
        #quad2,
        #quad3,
        #quad4 {
            background-position-y: -5px;
        }

        #quad5,
        #quad6,
        #quad7,
        #quad8 {
            background-position-y: -105px;
        }

        #quad9,
        #quad10,
        #quad11,
        #quad12 {
            background-position-y: -205px;
        }

        #quad13,
        #quad14,
        #quad15,
        #quad16 {
            background-position-y: -305px;
        }

        #quad17,
        #quad18,
        #quad19,
        #quad20 {
            background-position-y: -405px;
        }

        /* X */
        #quad1,
        #quad5,
        #quad9,
        #quad13,
        #quad17 {
            background-position-x: -5px;
        }

        #quad2,
        #quad6,
        #quad10,
        #quad14,
        #quad18 {
            background-position-x: -105px;
        }

        #quad3,
        #quad7,
        #quad11,
        #quad15,
        #quad19 {
            background-position-x: -205px;
        }

        #quad4,
        #quad8,
        #quad12,
        #quad16,
        #quad20 {
            background-position-x: -305px;
        }

        /* [quadrado="1"] { */
        /* background-position: 400px 0px; */
        /* } */
    </style>
</head>
