<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game Show</title>
<style>
body {
    background: black;
    color: white;
    text-align: center;
    font-family: Arial;
}
#pergunta {
    font-size: 40px;
    margin-top: 100px;
}
#resposta {
    font-size: 60px;
    color: yellow;
    margin-top: 50px;
}
</style>
</head>
<body>

<div id="pergunta">Quem apertar primeiro ganha!</div>
<div id="resposta"></div>

<script>
setInterval(() => {
    fetch('estado.txt')
    .then(res => res.text())
    .then(data => {
        document.getElementById('resposta').innerText = data;
    });
}, 500);
</script>

</body>
</html>
