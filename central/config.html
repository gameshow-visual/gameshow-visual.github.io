<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../lib/css/padrao.css">
    <script type="text/javascript" src="../lib/javascript/padrao.js"></script>

    <style>
        body {
            align-content: center;
        }

        button {
            position: relative !important;
            float: left !important;
        }        
    </style>
</head>

<body>
    <button style="height: 70px; width: 200px;" onclick="saigeral('modo=retrato')"><img
            src="../lib/img/util/modo-retrato.png" style="width: 50px; margin-right: 10px;">RETRATO</button>
    <button style="height: 70px; width: 200px;" onclick="saigeral('modo=paisagem')"><img
            src="../lib/img/util/modo-paisagem.png" style="width: 50px; margin-right: 10px;">PAISAGEM</button>
    <button style="height: 70px; width: 200px;" onclick="saigeral('modo=reiniciar')"><img
            src="../lib/img/util/resetar.png" style="width: 50px; margin-right: 10px;">Reiniciar</button>
</body>

<script>
    function saigeral(comando) {
        fetch("saida/geral.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: "geral=" + encodeURIComponent(comando)
        });
        console.log("[GERAL] ENVIADO:", comando);
    }
</script>

</html>
