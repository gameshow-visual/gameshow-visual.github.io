<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="../lib/css/padrao.css">
</head>

<style>
    img {
        width: 95%;
        height: 95%;
        object-fit: contain;
    }

    [rodando] {
        animation: girando 20s ease-in-out infinite;
    }

    @keyframes girando {

        0% {
            transform:
                rotateZ(0deg)
        }

        100% {
            transform:
                rotateZ(360deg)
        }
    }

    [logo] {
        position: absolute;
        aspect-ratio: 1/1;
        width: 400px;
    }

    [logo]>img {
        width: 100%;
        height: 100%;
        position: absolute;
        object-fit: cover;
    }

    [ligrosa] {
        animation: neonrosa 5s ease-in-out infinite;
    }

    [ligamar] {
        animation: neonamar 5s ease-in-out infinite;
    }

    @keyframes neonrosa {
        50% {
            filter:
                drop-shadow(0 0 12px #ff59c7);
        }

        0%,
        100% {
            filter:
                drop-shadow(0 0 0px #ff59c7);
        }
    }


    @keyframes neonamar {
        50% {
            filter:
                drop-shadow(0 0 12px #ffcc00);
        }

        0%,
        100% {
            filter:
                drop-shadow(0 0 0px #ffcc00);
        }
    }

    [nome] {
        color: white;
        position: absolute;
        /* border: 1px solid white; */
        display: flex;
        align-items: center;
        justify-content: center;

        text-align: center;
        white-space: normal;
        word-wrap: break-word;
    }

    .glitch-trans {
        font-family: 'HennyPenny';
        position: relative;
        font-weight: 700;
        line-height: 1.2;
        color: #fff;
        letter-spacing: 5px;
        transform: skewX(15deg) skewY(-15deg);
        z-index: 1;
        text-shadow: 2px 2px 5px black;
    }

    @media screen and (width: 960px) and (height: 540px) and (orientation: landscape) {
        [logo] {
            top: 5%;
        }

        [nome] {
            bottom: 5%;
            width: 100%;
        }

        .glitch-trans {
            font-size: 70px;
            animation: shift 4s ease-in-out infinite alternate;
        }
    }

    @media screen and (width: 540px) and (height: 960px) and (orientation: portrait) {
        [logo] {
            top: 17%;
        }

        [nome] {
            bottom: 17%;
            width: 100%;
        }

        .glitch-trans {
            font-size: 90px;
            animation: shift-2 4s ease-in-out infinite alternate;            
        }
    }

    @keyframes shift {

        0%,
        40%,
        44%,
        58%,
        61%,
        65%,
        69%,
        73%,
        100% {
            transform: skewX(0deg);
        }

        41% {
            transform: skewX(10deg);
        }

        42% {
            transform: skewX(-10deg);
        }

        59% {
            transform: skewX(40deg) skewY(7deg);
        }

        60% {
            transform: skewX(-40deg) skewY(-7deg);
        }

        63% {
            transform: skewX(10deg) skewY(-5deg);
        }

        70% {
            transform: skewX(-50deg) skewY(-7deg);
        }

        71% {
            transform: skewX(10deg) skewY(-7deg);
        }
    }

    @keyframes shift-2 {

        0%,
        40%,
        44%,
        58%,
        61%,
        65%,
        69%,
        73%,
        100% {
            transform: skewX(0deg);
        }

        41% {
            transform: skewX(25deg);
        }

        42% {
            transform: skewX(-25deg);
        }

        59% {
            transform: skewX(15deg) skewY(15deg);
        }

        60% {
            transform: skewX(-15deg) skewY(-15deg);
        }

        63% {
            transform: skewX(15deg) skewY(-15deg);
        }

        70% {
            transform: skewX(-15deg) skewY(-15deg);
        }

        71% {
            transform: skewX(15deg) skewY(-15deg);
        }
    }
</style>

<body>
    <!-- <img rodando src="../lib/img/logo/colorido.png"> -->

    <div logo>
        <img src="../lib/img/logo/svg-azul.svg">
        <img ligamar src="../lib/img/logo/svg-amarelo.svg">
        <img ligrosa src="../lib/img/logo/svg-rosa.svg">
        <img src="../lib/img/logo/svg-branco.svg">
    </div>
    <div nome>
        <div class="glitch-trans">GameShow & Visual</div>
    </div>



</body>

</html>
