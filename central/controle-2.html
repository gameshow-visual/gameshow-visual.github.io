<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- <meta name="apple-mobile-web-app-capable" content="yes"> -->
    <!-- <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="../lib/json/manifest.json">
    <title>GameShow & Visual</title>
    <link rel="stylesheet" href="../lib/css/padrao.css">
    <script type="text/javascript" src="../lib/javascript/padrao.js"></script>
    <style>
        body {
            background-color: black;
        }

        [ifundo] {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        [menu] {
            position: fixed;
            bottom: 5px;
            left: 5px;
            z-index: 4;
        }

        [interacao] {
            position: fixed;
            bottom: 5px;
            right: 5px;
            z-index: 4;
        }

        [cartoes] {
            position: fixed;
            top: 5px;
            right: 5px;
            z-index: 4;
        }

        [menu-controle] {
            width: 60px;
            height: 60px;
            border-radius: 25%;
            background: #333;
            color: white;
            font-size: 24px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        [lista-menu] {
            display: none;
            flex-direction: column;
            margin-bottom: 10px;

            max-height: 310px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 5px;
            grid-template-columns: repeat(auto-fill, 60px);
        }

        [link-menu] {
            width: 60px;
            height: 60px;
            min-width: 60px;
            min-height: 60px;

            border-radius: 25%;
            border: none;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #333;

            flex-shrink: 0;
            margin-top: 2px;
        }

        #setamenu {
            position: absolute;
            width: 30px;
            filter: invert();
        }

        #menuinte {
            position: absolute;
            width: 90%;
        }

        [link-menu]>img {
            object-fit: contain;
            width: 90%;
        }

        [menu-interacao] {
            position: absolute !important;
            width: 90%;
            height: 95%;
            /* top: 2.5%; */
            /* border: 1px solid white; */
            /* box-sizing: border-box; */
            background-color: #e4e4e480;
            z-index: 99 !important;
            border-radius: 20px;
            display: none;
            align-items: center;
            justify-content: center;
        }

        [menu-interacao]>[sair] {
            position: absolute;
            width: 65px;
            height: 65px;
            bottom: 5px;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        [idinte] {
            display: flex;
            align-items: center;
            justify-content: center !important;
            flex-wrap: wrap;
            width: 100%;
            height: 100%;
        }

        [idinte]>[grupo] {
            border: 1px solid white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        [grupo]>div {
            margin: 1px;
        }

        [logofundo] {
            width: 95%;
            height: 95%;
            object-fit: contain;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <img logofundo src="../lib/img/logo/colorido.png">
    <iframe ifundo id="menucontrole" src="" frameBorder="0" scrolling="no"></iframe>
    <!-- <div botao style="width: 100px; height: 100px;">OI</div>
    <div botao="amarelo" style="width: 100px; height: 100px;">OI</div>
    <div botao="azul" style="width: 100px; height: 100px;">OI</div>
    <div botao="verde" style="width: 100px; height: 100px;">OI</div>
    <div botao="vermelho" style="width: 100px; height: 100px;">OI</div>
    <div botao="laranja" style="width: 100px; height: 100px;">OI</div>
    <div botao="roxo" style="width: 100px; height: 100px;">OI</div>
    <div botao="rosa" style="width: 100px; height: 100px;">OI</div>
    <div botao="marrom" style="width: 100px; height: 100px;">OI</div>
    <div botao="preto" style="width: 100px; height: 100px;">OI</div> -->

    <div menu>
        <div menu-controle onclick="toggleMenu()">
            <img id="setamenu" src="../lib/img/util/cima.png">
        </div>

        <div lista-menu id="menuItems">
            <div laranja link-menu onclick="abrirmenu('config.html')"><img src="../lib/img/util/menu.png"></div>
        </div>
    </div>

    <div cartoes>
        <div menu-controle onclick="toggleCartoes()">
            <img style="position: absolute; width: 80%; transform: rotate(20deg); right: 0px;" src="
                ../lib/img/util/cartao-vermelho.png">
            <img style="position: absolute; width: 80%; transform: rotate(-20deg); left: 0px;"
                src="../lib/img/util/cartao-amarelo.png">
        </div>

        <div lista-menu id="menuCartoes">
            <div amarelo link-menu onclick="saibase('cartao=amarelo');"><img src="../lib/img/util/cartao-amarelo.png">
            </div>
            <div vermelho link-menu onclick="saibase('cartao=vermelho');"><img
                    src="../lib/img/util/cartao-vermelho.png"></div>
        </div>
    </div>

    <div interacao>
        <div menu-controle onclick="toggleInte()">
            <img id="menuinte" src="../lib/img/util/iniciar.png">
        </div>

        <div lista-menu id="menuInte">
            <div link-menu azul onclick="interacao('coracao')"><img src="../lib/img/util/cor.png"></div>
            <div link-menu azul onclick="interacao('placar')"><img src="../lib/img/util/vs.png"></div>
            <div link-menu verde onclick="interacao('torneio')"><img style="width: 80%"
                    src="../lib/img/util/torneio.png">
            </div>
            <div link-menu verde onclick="interacao('contagem')"><img src="../lib/img/util/m-3.png"></div>
            <div link-menu azul onclick="interacao('social')"><img style="width: 80%" src="../lib/img/util/social.png">
            </div>
        </div>
    </div>

    <div menu-interacao id="menu-interacao">
        <div idinte id="int-cartao" style="display: none;">
            <div grupo style="width: 225px; height: 120px;">
                <div botao="amarelo" style="width: 100px; height: 100px;"><img src="../lib/img/util/cartao-amarelo.png">
                </div>
                <div botao="vermelho" style="width: 100px; height: 100px;"><img
                        src="../lib/img/util/cartao-vermelho.png"></div>
            </div>
        </div>
        <div idinte id="int-coracao" style="display: none;">
            <div botao="azul"
                style="width: 120px; height: 80px; border: 5px outset rgb(0, 60, 128); position: absolute; top: 150px;">
                <img src="../lib/img/util/olho.png">
            </div>

            <div grupo style="width: 140px; height: 75px; margin: 2px;">
                <div botao="verde" style="width: 65px; height: 65px; border: 5px outset rgb(0, 128, 11);"><img
                        src="../lib/img/util/adicao.png"></div>
                <div botao="vermelho" style="width: 65px; height: 65px; border: 5px outset rgb(230, 0, 0);"><img
                        src="../lib/img/util/subtracao.png"></div>
            </div>
            <div grupo style="width: 140px; height: 75px; margin: 2px;">
                <div botao="vermelho" style="width: 65px; height: 65px; border: 5px outset rgb(230, 0, 0);"><img
                        src="../lib/img/util/subtracao.png"></div>
                <div botao="verde" style="width: 65px; height: 65px; border: 5px outset rgb(0, 128, 11);"><img
                        src="../lib/img/util/adicao.png"></div>
            </div>
            <div botao="laranja"
                style="width: 120px; height: 80px; border: 5px outset rgb(192, 77, 1); position: absolute; bottom: 150px;">
                <img src="../lib/img/util/reiniciar.png" style="width: 60%;">
            </div>
        </div>
        <div botao sair onclick="interacao('sair')"><img style="width: 80%;" src="../lib/img/util/sair.png"></div>
    </div>
    <div corfundo></div>

</body>
<script>
    function toggleMenu() {
        // document.documentElement.requestFullscreen();
        const menu = document.getElementById("menuItems");
        menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
        if (menu.style.display === "flex") {
            document.getElementById("setamenu").src = "../lib/img/util/abaixo.png";
        } else {
            document.getElementById("setamenu").src = "../lib/img/util/cima.png";

        }
    }

    function toggleInte() {
        const menu2 = document.getElementById("menuInte");
        menu2.style.display = (menu2.style.display === "flex") ? "none" : "flex";
        // if (menu.style.display === "flex") {
        //     document.getElementById("setamenu").src = "../lib/img/menu/abaixo.png";
        // } else {
        //     document.getElementById("setamenu").src = "../lib/img/menu/cima.png";

        // }        
        // corfundo();
    }

    function toggleCartoes() {
        const menu2 = document.getElementById("menuCartoes");
        menu2.style.display = (menu2.style.display === "flex") ? "none" : "flex";
        // if (menu.style.display === "flex") {
        //     document.getElementById("setamenu").src = "../lib/img/menu/abaixo.png";
        // } else {
        //     document.getElementById("setamenu").src = "../lib/img/menu/cima.png";

        // }        
        // corfundo();
    }

    const mninte = ['int-coracao'];
    function interacao(valor) {
        if (valor === "abrir") {
            corfundo();
            const menu = document.getElementById("menu-interacao");
            menu.style.display = (menu.style.display != "flex") ? "none" : "flex";
        }
        else if (valor === "coracao") {
            corfundo();
            toggleInte();
            document.getElementById("menu-interacao").style.display = "flex";
            document.getElementById("int-coracao").style.display = "flex";
        }
        else if (valor === "placar") {
            // corfundo();
            toggleInte();
            // document.getElementById("menu-interacao").style.display = "flex";
            // document.getElementById("int-coracao").style.display = "flex";
            console.log(valor);
        }
        else if (valor === "torneio") {
            // corfundo();
            toggleInte();
            // document.getElementById("menu-interacao").style.display = "flex";
            // document.getElementById("int-coracao").style.display = "flex";
            console.log(valor);
        }
        else if (valor === "contagem") {
            // corfundo();
            toggleInte();
            // document.getElementById("menu-interacao").style.display = "flex";
            // document.getElementById("int-coracao").style.display = "flex";
            console.log(valor);
        }
        else if (valor === "social") {
            // corfundo();
            toggleInte();
            // document.getElementById("menu-interacao").style.display = "flex";
            // document.getElementById("int-coracao").style.display = "flex";
            console.log(valor);
        }
        else if (valor === "sair") {
            corfundo();
            // alert(valor)
            for (let i = 0; i < mninte.length; i++) {
                document.getElementById(mninte[i]).style.display = "none";
            }
            document.getElementById("menu-interacao").style.display = "none";
        }

    }

    function abrirmenu(arquivo) {
        toggleMenu();
        document.getElementById("menucontrole").src = arquivo;
    }

    function cartao(cor) {
        toggleCartoes();
        console.log(cor);
    }

    function saigeral(comando) {
        fetch("saida/geral.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: "geral=" + encodeURIComponent(comando)
        });
        console.log("[GERAL] ENVIADO:", comando);
    }

    function saibase(comando) {
        fetch("saida/base.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: "base=" + encodeURIComponent(comando)
        });
        console.log("[BASE] ENVIADO:", comando);
    }

</script>
